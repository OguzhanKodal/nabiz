[package]
name = "nabiz"
version = "0.1.0"
description = "Linux laptoplar için kontrol merkezi"
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "nabiz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
lto = true
opt-level = "s"
strip = true
